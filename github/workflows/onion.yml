# SATU FILE untuk dijalankan dari HP: tidak perlu mengunggah folder atau zip.
# Cara: di GitHub (repo baru, kosong) pilih Add file > Create new file, beri nama
#   .github/workflows/onion.yml
# tempel seluruh isi file ini, Commit, lalu buka tab Actions > onion > Run workflow.
# Isi: (1) uji MultiplierAccountant, offline, tanpa RPC; (2) probe dan uji fork ke Robinhood Chain.
# Hasil dibaca dari log tiap langkah. Langkah (2) yang gagal tidak menghentikan langkah lain.
name: onion
on:
  workflow_dispatch:
    inputs:
      stock:
        description: Alamat token saham untuk probe (default SPY)
        default: "0x117cc2133c37B721F49dE2A7a74833232B3B4C0C"
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://rpc.mainnet.chain.robinhood.com
      STOCK: ${{ inputs.stock }}
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Tulis file proyek
        run: |
          set -e
          mkdir -p acct
          cat > acct/foundry.toml <<'ONION_EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.24"
          # Fork tests memanggil RPC berulang kali: jaga jumlah run fuzz tetap kecil.

          [fuzz]
          runs = 64
          ONION_EOF
          mkdir -p acct/src
          cat > acct/src/MultiplierAccountant.sol <<'ONION_EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.24;

          interface IStockMultiplier {
              function uiMultiplier() external view returns (uint256);
              function newUIMultiplier() external view returns (uint256);
              function effectiveAt() external view returns (uint256);
          }

          /// @notice Satu accountant per token saham. Memantau uiMultiplier() dan mengklasifikasi tiap perubahan:
          ///   - dividen: kenaikan sampai 3% (MAX_DIVIDEND_BPS) -> menaikkan dividendIndex
          ///   - split:   rasio bulat >= 2:1 naik atau turun -> mengubah splitFactor
          ///   - lainnya: DITAHAN. isSynced() jadi false sampai guardian memutuskan setelah HOLD_PERIOD.
          /// Pita dividen (<= 3%) dan split (rasio bulat >= 2) tidak tumpang tindih, jadi tidak ada perubahan yang bisa ditebak dua arti.
          /// Draf: belum diaudit, belum dihubungkan ke Vault. Pita dan HOLD_PERIOD adalah angka awal yang bisa disesuaikan.
          contract MultiplierAccountant {
              uint256 internal constant WAD = 1e18;
              uint256 public constant MAX_DIVIDEND_BPS = 300;
              uint256 public constant HOLD_PERIOD = 2 days;

              struct Pending {
                  bool exists;
                  uint64 detectedAt;
                  uint64 resolvableAt;
                  uint256 oldM;
                  uint256 newM;
              }

              struct Checkpoint {
                  uint64 timestamp;
                  uint192 index;
              }

              IStockMultiplier public immutable stock;
              address public immutable guardian;

              uint256 public lastMultiplier;
              uint256 public dividendIndex = WAD;
              uint256 public splitFactor = WAD;
              Pending public pending;
              Checkpoint[] private _checkpoints;

              event Dividend(uint256 oldM, uint256 newM, uint256 index);
              event Split(uint256 oldM, uint256 newM, uint256 factor);
              event Held(uint256 oldM, uint256 newM, uint64 resolvableAt);
              event HeldCleared(uint256 oldM, uint256 newM);
              event Resolved(bool asSplit, uint256 oldM, uint256 newM);

              constructor(address stock_, address guardian_) {
                  require(stock_ != address(0) && guardian_ != address(0), "zero address");
                  stock = IStockMultiplier(stock_);
                  guardian = guardian_;
                  uint256 m = IStockMultiplier(stock_).uiMultiplier();
                  require(m > 0, "multiplier is zero");
                  lastMultiplier = m;
                  _checkpoints.push(Checkpoint(uint64(block.timestamp), uint192(WAD)));
              }

              /// @notice true jika indeks sudah sesuai dengan multiplier token saat ini.
              function isSynced() public view returns (bool) {
                  return !pending.exists && stock.uiMultiplier() == lastMultiplier;
              }

              /// @notice Siapa pun boleh memanggil. Mengembalikan true jika setelah panggilan ini indeks sudah sinkron.
              function sync() external returns (bool) {
                  uint256 m = stock.uiMultiplier();
                  require(m > 0, "multiplier is zero");

                  if (pending.exists) {
                      if (m == pending.newM) return false; // masih menunggu guardian
                      emit HeldCleared(pending.oldM, pending.newM); // multiplier sudah bergerak lagi: nilai yang ditahan basi
                      delete pending;
                  }

                  uint256 last = lastMultiplier;
                  if (m == last) return true;

                  if (_isDividend(last, m)) {
                      _applyDividend(last, m);
                      return true;
                  }
                  if (_isSplit(last, m)) {
                      _applySplit(last, m);
                      return true;
                  }

                  uint64 at = uint64(block.timestamp + HOLD_PERIOD);
                  pending = Pending(true, uint64(block.timestamp), at, last, m);
                  emit Held(last, m, at);
                  return false;
              }

              /// @notice Guardian memutuskan perubahan yang ditahan, paling cepat setelah HOLD_PERIOD.
              function resolve(bool asSplit) external {
                  require(msg.sender == guardian, "not guardian");
                  Pending memory p = pending;
                  require(p.exists, "nothing held");
                  require(block.timestamp >= p.resolvableAt, "timelock");
                  require(stock.uiMultiplier() == p.newM, "multiplier moved: call sync");
                  delete pending;
                  if (asSplit) {
                      _applySplit(p.oldM, p.newM);
                  } else {
                      require(p.newM > p.oldM, "a dividend cannot lower the multiplier");
                      _applyDividend(p.oldM, p.newM);
                  }
                  emit Resolved(asSplit, p.oldM, p.newM);
              }

              /// @notice Perubahan yang sudah dijadwalkan penerbit tetapi belum berlaku.
              function scheduled() external view returns (bool exists, uint256 newM, uint256 at) {
                  newM = stock.newUIMultiplier();
                  at = stock.effectiveAt();
                  exists = newM != 0 && newM != stock.uiMultiplier() && at > block.timestamp;
              }

              function checkpointCount() external view returns (uint256) {
                  return _checkpoints.length;
              }

              function checkpointAt(uint256 i) external view returns (uint64 timestamp, uint192 index) {
                  Checkpoint memory c = _checkpoints[i];
                  return (c.timestamp, c.index);
              }

              /// @notice Indeks dividen pada waktu ts (1e18 = 1.0).
              function dividendIndexAt(uint256 ts) external view returns (uint256) {
                  require(ts >= _checkpoints[0].timestamp, "before first checkpoint");
                  uint256 lo = 0;
                  uint256 hi = _checkpoints.length - 1;
                  while (lo < hi) {
                      uint256 mid = (lo + hi + 1) / 2;
                      if (_checkpoints[mid].timestamp <= ts) lo = mid;
                      else hi = mid - 1;
                  }
                  return _checkpoints[lo].index;
              }

              function _isDividend(uint256 last, uint256 m) internal pure returns (bool) {
                  return m > last && (m - last) * 10_000 <= last * MAX_DIVIDEND_BPS;
              }

              function _isSplit(uint256 last, uint256 m) internal pure returns (bool) {
                  if (m > last) return m % last == 0 && m / last >= 2;
                  return last % m == 0 && last / m >= 2;
              }

              function _applyDividend(uint256 last, uint256 m) internal {
                  dividendIndex = (dividendIndex * m) / last;
                  _checkpoints.push(Checkpoint(uint64(block.timestamp), uint192(dividendIndex)));
                  lastMultiplier = m;
                  emit Dividend(last, m, dividendIndex);
              }

              function _applySplit(uint256 last, uint256 m) internal {
                  splitFactor = (splitFactor * m) / last;
                  lastMultiplier = m;
                  emit Split(last, m, splitFactor);
              }
          }
          ONION_EOF
          mkdir -p acct/test
          cat > acct/test/MultiplierAccountant.t.sol <<'ONION_EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.24;

          import {Test} from "forge-std/Test.sol";
          import {MultiplierAccountant} from "../src/MultiplierAccountant.sol";

          contract MockStock {
              uint256 public uiMultiplier = 1e18;
              uint256 public newUIMultiplier;
              uint256 public effectiveAt;

              function set(uint256 m) external {
                  uiMultiplier = m;
              }

              function stage(uint256 m, uint256 at) external {
                  newUIMultiplier = m;
                  effectiveAt = at;
              }
          }

          contract MultiplierAccountantTest is Test {
              MockStock s;
              MultiplierAccountant a;
              address g = address(0xB0B);

              function setUp() public {
                  vm.warp(1_000_000);
                  s = new MockStock();
                  a = new MultiplierAccountant(address(s), g);
              }

              function test_dividendRaisesIndex() public {
                  s.set(1.01e18);
                  assertTrue(a.sync());
                  assertEq(a.dividendIndex(), 1.01e18);
                  assertEq(a.splitFactor(), 1e18);
                  assertTrue(a.isSynced());
              }

              function test_justOverDividendBandIsHeld() public {
                  s.set(1.0301e18);
                  assertFalse(a.sync());
                  assertFalse(a.isSynced());
                  (bool ex,,,,) = a.pending();
                  assertTrue(ex);
                  assertEq(a.dividendIndex(), 1e18);
              }

              function test_splitTwoToOne() public {
                  s.set(2e18);
                  assertTrue(a.sync());
                  assertEq(a.splitFactor(), 2e18);
                  assertEq(a.dividendIndex(), 1e18);
              }

              function test_reverseSplitRestoresFactor() public {
                  s.set(2e18);
                  a.sync();
                  s.set(1e18);
                  assertTrue(a.sync());
                  assertEq(a.splitFactor(), 1e18);
              }

              function test_tenPercentHeldThenGuardianResolvesAsDividend() public {
                  s.set(1.1e18);
                  assertFalse(a.sync());

                  vm.prank(g);
                  vm.expectRevert(bytes("timelock"));
                  a.resolve(false);

                  vm.warp(block.timestamp + 2 days);

                  vm.expectRevert(bytes("not guardian"));
                  a.resolve(false);

                  vm.prank(g);
                  a.resolve(false);
                  assertEq(a.dividendIndex(), 1.1e18);
                  assertTrue(a.isSynced());
              }

              function test_heldCanBeResolvedAsSplit() public {
                  s.set(1.5e18);
                  assertFalse(a.sync());
                  vm.warp(block.timestamp + 2 days);
                  vm.prank(g);
                  a.resolve(true);
                  assertEq(a.splitFactor(), 1.5e18);
                  assertEq(a.dividendIndex(), 1e18);
              }

              function test_dividendCannotLowerMultiplier() public {
                  s.set(0.9e18);
                  assertFalse(a.sync());
                  vm.warp(block.timestamp + 2 days);
                  vm.prank(g);
                  vm.expectRevert(bytes("a dividend cannot lower the multiplier"));
                  a.resolve(false);
                  vm.prank(g);
                  a.resolve(true);
                  assertEq(a.splitFactor(), 0.9e18);
              }

              function test_staleHeldValueIsClearedBySync() public {
                  s.set(1.1e18);
                  assertFalse(a.sync());
                  s.set(1.01e18);
                  assertTrue(a.sync());
                  (bool ex,,,,) = a.pending();
                  assertFalse(ex);
                  assertEq(a.dividendIndex(), 1.01e18);
              }

              function test_resolveRevertsIfMultiplierMoved() public {
                  s.set(1.1e18);
                  a.sync();
                  vm.warp(block.timestamp + 2 days);
                  s.set(1.2e18);
                  vm.prank(g);
                  vm.expectRevert(bytes("multiplier moved: call sync"));
                  a.resolve(false);
              }

              function test_dividendIndexAtHistory() public {
                  uint256 t0 = block.timestamp;
                  vm.warp(t0 + 100);
                  s.set(1.01e18);
                  a.sync();
                  vm.warp(t0 + 200);
                  s.set(1.02e18);
                  a.sync();

                  assertEq(a.dividendIndexAt(t0 + 50), 1e18);
                  assertEq(a.dividendIndexAt(t0 + 100), 1.01e18);
                  assertEq(a.dividendIndexAt(t0 + 150), 1.01e18);
                  assertEq(a.dividendIndexAt(t0 + 250), 1.02e18);
                  assertEq(a.checkpointCount(), 3);

                  vm.expectRevert(bytes("before first checkpoint"));
                  a.dividendIndexAt(1);
              }

              function test_scheduledView() public {
                  s.stage(1.05e18, block.timestamp + 1 days);
                  (bool ex, uint256 m,) = a.scheduled();
                  assertTrue(ex);
                  assertEq(m, 1.05e18);

                  vm.warp(block.timestamp + 2 days);
                  (ex,,) = a.scheduled();
                  assertFalse(ex);

                  s.stage(1e18, block.timestamp + 1 days);
                  (ex,,) = a.scheduled();
                  assertFalse(ex);
              }

              function testFuzz_dividendBandIsApplied(uint256 bps) public {
                  bps = bound(bps, 1, 300);
                  s.set(1e18 + (1e18 * bps) / 10_000);
                  assertTrue(a.sync());
                  assertTrue(a.isSynced());
              }

              function testFuzz_betweenBandsIsHeld(uint256 bps) public {
                  bps = bound(bps, 301, 9_999);
                  s.set(1e18 + (1e18 * bps) / 10_000);
                  assertFalse(a.sync());
                  assertFalse(a.isSynced());
              }
          }
          ONION_EOF
          mkdir -p fork
          cat > fork/foundry.toml <<'ONION_EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.24"
          # Fork tests memanggil RPC berulang kali: jaga jumlah run fuzz tetap kecil.

          [fuzz]
          runs = 64
          ONION_EOF
          mkdir -p fork/test
          cat > fork/test/StockTokenProbe.t.sol <<'ONION_EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;

          import {Test, console2} from "forge-std/Test.sol";
          import {IStockToken} from "./Interfaces.sol";

          /// Memeriksa asumsi OS-01 pada token saham ASLI di fork. Tidak butuh source kontrak Onion.
          /// Env wajib: RPC_URL, STOCK. Opsional: FORK_BLOCK.
          /// test_05 butuh: BLOCK_A, BLOCK_B, HOLDER.   test_06 butuh: START_BLOCK, END_BLOCK (SAMPLES opsional).
          contract StockTokenProbe is Test {
              IStockToken internal stock;

              // EIP-1967
              bytes32 internal constant IMPL_SLOT = 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc;
              bytes32 internal constant ADMIN_SLOT = 0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103;

              function setUp() public {
                  string memory url = vm.envString("RPC_URL");
                  uint256 blk = vm.envOr("FORK_BLOCK", uint256(0));
                  if (blk == 0) vm.createSelectFork(url);
                  else vm.createSelectFork(url, blk);
                  stock = IStockToken(vm.envAddress("STOCK"));
              }

              function _mult() internal view returns (bool ok, uint256 m) {
                  try stock.uiMultiplier() returns (uint256 v) {
                      return (true, v);
                  } catch {
                      return (false, 0);
                  }
              }

              /// 1. Token ada, desimal 18 (vault mengasumsikan 18).
              function test_01_basics() public {
                  console2.log("STOCK", address(stock));
                  assertGt(address(stock).code.length, 0, "no code at STOCK: wrong address or wrong chain");
                  try stock.symbol() returns (string memory s) {
                      console2.log("symbol", s);
                  } catch {
                      console2.log("symbol() reverted");
                  }
                  try stock.decimals() returns (uint8 d) {
                      console2.log("decimals", uint256(d));
                      assertEq(uint256(d), 18, "vault assumes 18 decimals");
                  } catch {
                      console2.log("decimals() reverted");
                  }
                  console2.log("totalSupply", stock.totalSupply());
              }

              /// 2. uiMultiplier() ada, mengembalikan satu word, skala 1e18, basis 1.0, arah naik.
              function test_02_multiplierScale() public {
                  (bool ok, bytes memory ret) =
                      address(stock).staticcall(abi.encodeWithSelector(IStockToken.uiMultiplier.selector));
                  assertTrue(ok, "uiMultiplier() does not exist or reverts (OS-01: name/selector wrong)");
                  assertEq(ret.length, 32, "uiMultiplier() return is not a single 32-byte word");
                  uint256 m = abi.decode(ret, (uint256));
                  console2.log("uiMultiplier", m);
                  assertGe(m, 1e18, "multiplier < 1.0: base or direction assumption is wrong");
                  assertLt(m, 100e18, "multiplier implausibly large: scale assumption (1e18) is wrong");
              }

              /// 3. Apakah token proxy / bisa di-pause? Hanya mencatat; baca source implementasi di Blockscout.
              function test_03_proxyAndPause() public {
                  address impl = address(uint160(uint256(vm.load(address(stock), IMPL_SLOT))));
                  address admin = address(uint160(uint256(vm.load(address(stock), ADMIN_SLOT))));
                  console2.log("EIP-1967 implementation", impl);
                  console2.log("EIP-1967 admin", admin);
                  (bool ok, bytes memory r) = address(stock).staticcall(abi.encodeWithSignature("paused()"));
                  console2.log("paused() callable", ok);
                  if (ok && r.length == 32) console2.log("paused", abi.decode(r, (bool)));
              }

              /// 4. REBASE ATAU TIDAK? Bandingkan dua blok di sekitar satu perubahan multiplier.
              ///    Pilih HOLDER yang pasif (tidak transfer di antara dua blok).
              ///    Non-rebasing: balanceOf tetap, multiplier berubah.  Rebasing: balanceOf ikut naik.
              function test_05_rebaseOrNot() public {
                  uint256 a = vm.envUint("BLOCK_A");
                  uint256 b = vm.envUint("BLOCK_B");
                  address holder = vm.envAddress("HOLDER");

                  vm.rollFork(a);
                  (bool okA, uint256 mA) = _mult();
                  uint256 balA = stock.balanceOf(holder);
                  uint256 supA = stock.totalSupply();

                  vm.rollFork(b);
                  (bool okB, uint256 mB) = _mult();
                  uint256 balB = stock.balanceOf(holder);
                  uint256 supB = stock.totalSupply();

                  require(okA && okB, "uiMultiplier unavailable at one of the blocks");
                  console2.log("multiplier A", mA);
                  console2.log("multiplier B", mB);
                  console2.log("holder balance A", balA);
                  console2.log("holder balance B", balB);
                  console2.log("totalSupply A", supA);
                  console2.log("totalSupply B", supB);

                  if (mA == mB) {
                      console2.log("multiplier did not change between the blocks; pick blocks around a change");
                      vm.skip(true);
                  }
                  assertEq(balA, balB, "REBASING: balanceOf moved with the multiplier. Vault accounting must be redesigned");
                  assertEq(supA, supB, "totalSupply moved: mint/burn or rebase between blocks (check holder/blocks)");
              }

              /// 5. Pindai riwayat: multiplier tidak boleh turun, dan satu langkah tidak boleh > +10%.
              ///    Sampling bisa melewatkan langkah di antaranya; perbesar SAMPLES bila perlu.
              function test_06_historyScan() public {
                  uint256 a = vm.envUint("START_BLOCK");
                  uint256 b = vm.envUint("END_BLOCK");
                  uint256 n = vm.envOr("SAMPLES", uint256(40));
                  require(b > a && n >= 2, "bad range");

                  uint256 prev;
                  uint256 bad;
                  for (uint256 i = 0; i < n; i++) {
                      uint256 blk = a + ((b - a) * i) / (n - 1);
                      vm.rollFork(blk);
                      (bool ok, uint256 m) = _mult();
                      if (!ok) {
                          console2.log("no uiMultiplier at block", blk);
                          continue;
                      }
                      if (prev != 0 && m != prev) {
                          console2.log("change at/before block", blk);
                          console2.log("  from", prev);
                          console2.log("  to  ", m);
                          if (m < prev) {
                              console2.log("  DECREASE");
                              bad++;
                          } else if ((m * 1e18) / prev > 1.1e18) {
                              console2.log("  JUMP > 10%");
                              bad++;
                          }
                      }
                      prev = m;
                  }
                  assertEq(bad, 0, "multiplier history violates the vault's dividend band (OS-04 / OS-06)");
              }

              /// 6. Perubahan terjadwal (ERC-8056): newUIMultiplier() dan effectiveAt() bisa dibaca on-chain.
              ///    Accountant tidak boleh terkejut oleh perubahan yang sudah diumumkan.
              function test_07_pendingMultiplier() public {
                  (bool ok1, bytes memory r1) = address(stock).staticcall(abi.encodeWithSignature("newUIMultiplier()"));
                  (bool ok2, bytes memory r2) = address(stock).staticcall(abi.encodeWithSignature("effectiveAt()"));
                  console2.log("newUIMultiplier() callable", ok1);
                  console2.log("effectiveAt() callable", ok2);
                  if (ok1 && r1.length == 32 && ok2 && r2.length == 32) {
                      uint256 pending = abi.decode(r1, (uint256));
                      uint256 eff = abi.decode(r2, (uint256));
                      uint256 curM = stock.uiMultiplier();
                      console2.log("current  ", curM);
                      console2.log("pending  ", pending);
                      console2.log("effectiveAt", eff);
                      if (pending != curM) console2.log("A CHANGE IS SCHEDULED: the Accountant must handle it, not be surprised by it");
                  }
              }
          }
          ONION_EOF
          mkdir -p fork/test
          cat > fork/test/VaultFork.t.sol <<'ONION_EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;

          import {Test, console2} from "forge-std/Test.sol";
          import {IToken, IStockToken, IAccountant, IOnionVault} from "./Interfaces.sol";

          /// Menguji Vault yang SUDAH ter-deploy (di chain atau di fork lewat script deploy Anda).
          /// Perubahan multiplier disimulasikan dengan vm.mockCall pada stock.uiMultiplier().
          /// Ini mengasumsikan token NON-rebasing (diverifikasi oleh StockTokenProbe.test_05).
          ///
          /// Env wajib: RPC_URL, VAULT, WHALE (pemegang stok besar).
          /// Opsional : FORK_BLOCK, USER_ADDR (alamat yang lolos allowlist bila token membatasi transfer).
          /// Tanpa VAULT, semua test di-skip.
          ///
          /// ASUMSI yang TIDAK terverifikasi dari app: sync() ada di vault atau accountant (audit OS-03 menyebutnya).
          contract VaultForkTest is Test {
              IOnionVault internal vault;
              IAccountant internal acct;
              IStockToken internal stock;
              IToken internal pt;
              IToken internal yt;
              address internal user;
              address internal whale;
              uint256 internal cur; // multiplier yang sedang di-mock

              modifier live() {
                  if (address(vault) == address(0)) {
                      vm.skip(true);
                  }
                  _;
              }

              function setUp() public {
                  string memory url = vm.envString("RPC_URL");
                  uint256 blk = vm.envOr("FORK_BLOCK", uint256(0));
                  if (blk == 0) vm.createSelectFork(url);
                  else vm.createSelectFork(url, blk);

                  address v = vm.envOr("VAULT", address(0));
                  if (v == address(0)) return;

                  vault = IOnionVault(v);
                  stock = IStockToken(vault.stock());
                  acct = IAccountant(vault.accountant());
                  pt = IToken(vault.principal());
                  yt = IToken(vault.yieldToken());
                  user = vm.envOr("USER_ADDR", address(0xBEEF));
                  whale = vm.envAddress("WHALE");
                  cur = stock.uiMultiplier();

                  vm.prank(user);
                  stock.approve(address(vault), type(uint256).max);
              }

              // ---------------------------------------------------------------- helpers

              function _mock(uint256 m) internal {
                  cur = m;
                  vm.mockCall(address(stock), abi.encodeWithSelector(IStockToken.uiMultiplier.selector), abi.encode(m));
              }

              function _bump(uint256 bps) internal {
                  _mock((cur * (10_000 + bps)) / 10_000);
              }

              function _cap(uint256 want) internal view returns (uint256) {
                  uint256 w = stock.balanceOf(whale);
                  uint256 r = want > w ? w : want;
                  require(r > 0, "WHALE has no stock tokens");
                  return r;
              }

              function _tol(uint256 amt) internal pure returns (uint256) {
                  return amt / 1e9 + 10; // toleransi pembulatan: sesuaikan setelah melihat hasil nyata
              }

              function _fund(uint256 amt) internal {
                  vm.prank(whale);
                  require(stock.transfer(user, amt), "whale transfer failed (allowlist? set USER_ADDR)");
              }

              function _split(uint256 amt) internal {
                  _fund(amt);
                  vm.prank(user);
                  vault.split(amt, user);
              }

              function _sync() internal returns (bool ok) {
                  (ok,) = address(vault).call(abi.encodeWithSignature("sync()"));
                  if (!ok) {
                      (ok,) = address(acct).call(abi.encodeWithSignature("sync()"));
                  }
              }

              function _settleAndRedeem(bool syncFirst) internal returns (uint256 out) {
                  vm.warp(vault.maturity() + 1);
                  if (syncFirst) _sync();
                  uint256 before_ = stock.balanceOf(user);
                  vault.settle();
                  uint256 p = pt.balanceOf(user);
                  uint256 y = yt.balanceOf(user);
                  vm.startPrank(user);
                  if (p > 0) vault.redeemPrincipal(p, user);
                  if (y > 0) vault.redeemYield(y, user);
                  vm.stopPrank();
                  out = stock.balanceOf(user) - before_;
              }

              /// Catat bagaimana kontrak bereaksi terhadap perubahan multiplier tertentu.
              /// Janji dokumentasi: merge selalu terbuka sebagai jalan keluar.
              function _characterize(string memory label, uint256 newMult) internal {
                  uint256 amt = _cap(1e18);
                  _split(amt);
                  uint256 p = pt.balanceOf(user);

                  _mock(newMult);
                  bool synced = _sync();
                  bool pending;
                  try acct.reviewPending() returns (bool r) {
                      pending = r;
                  } catch {}

                  console2.log(label);
                  console2.log("  sync() ok", synced);
                  console2.log("  reviewPending", pending);

                  _fund(amt);
                  vm.prank(user);
                  try vault.split(amt, user) {
                      console2.log("  further split: allowed");
                  } catch {
                      console2.log("  further split: reverted");
                  }

                  bool mergeOk;
                  vm.prank(user);
                  try vault.merge(p, user) {
                      mergeOk = true;
                  } catch {}
                  console2.log("  merge ok", mergeOk);
                  assertTrue(mergeOk, string.concat(label, ": merge reverted; docs promise merge stays open as the exit"));
              }

              // ------------------------------------------------------------------ tests

              function test_roundtrip_splitMerge() public live {
                  uint256 amt = _cap(1e18);
                  _split(amt);
                  uint256 p = pt.balanceOf(user);
                  uint256 y = yt.balanceOf(user);
                  assertEq(p, y, "principal and yield supply must match before maturity");
                  vm.prank(user);
                  vault.merge(p, user);
                  uint256 back = stock.balanceOf(user);
                  console2.log("deposited", amt);
                  console2.log("got back ", back);
                  assertLe(back, amt, "merge returned more than was deposited");
                  assertGe(back + _tol(amt), amt, "split+merge lost more than rounding (split fee still TBD?)");
              }

              /// OS-08: vault harus menerima persis jumlah yang diminta (fee-on-transfer / rebasing / fee split).
              function test_splitCreditsFullAmount() public live {
                  uint256 amt = _cap(1e18);
                  _fund(amt);
                  uint256 b0 = stock.balanceOf(address(vault));
                  vm.prank(user);
                  vault.split(amt, user);
                  assertEq(
                      stock.balanceOf(address(vault)) - b0,
                      amt,
                      "vault custody delta != amount (fee-on-transfer, rebasing, or stock held elsewhere)"
                  );
              }

              /// Dua dividen normal lalu settle: kedua layer harus menjumlah ke deposit (docs bagian 02).
              function test_dividendFlow_solvency() public live {
                  uint256 amt = _cap(10e18);
                  _split(amt);
                  _bump(50);
                  _sync();
                  _bump(30);
                  _sync();
                  uint256 out = _settleAndRedeem(true);
                  console2.log("deposited", amt);
                  console2.log("redeemed ", out);
                  assertLe(out, amt, "vault paid out more than deposited: INSOLVENT");
                  assertGe(out + _tol(amt), amt, "value left behind beyond tolerance");
              }

              function test_anomaly_plus10pct_exact() public live {
                  _characterize("+10% exactly", (cur * 11) / 10);
              }

              function test_anomaly_plus10pct_plus1wei() public live {
                  _characterize("+10% + 1 wei", (cur * 11) / 10 + 1);
              }

              function test_anomaly_decrease() public live {
                  _characterize("-1% decrease", (cur * 99) / 100);
              }

              function test_anomaly_split2to1() public live {
                  _characterize("2:1 split", cur * 2);
              }

              /// OS-05: jika uiMultiplier() revert (pause/upgrade), pengguna tetap harus bisa keluar lewat merge.
              function test_oracleRevert_exitStillWorks() public live {
                  uint256 amt = _cap(1e18);
                  _split(amt);
                  uint256 p = pt.balanceOf(user);

                  vm.mockCallRevert(
                      address(stock), abi.encodeWithSelector(IStockToken.uiMultiplier.selector), bytes("paused")
                  );

                  bool mergeOk;
                  vm.prank(user);
                  try vault.merge(p, user) {
                      mergeOk = true;
                  } catch {}
                  console2.log("merge while uiMultiplier() reverts", mergeOk);
                  assertTrue(mergeOk, "OS-05: users cannot exit when the stock token's uiMultiplier() reverts");
              }

              /// OS-05 (bagian 2): setelah maturity, settle + redeem harus tetap jalan walau uiMultiplier() revert.
              function test_oracleRevert_afterMaturity_settleWorks() public live {
                  _split(_cap(1e18));
                  vm.warp(vault.maturity() + 1);
                  vm.mockCallRevert(
                      address(stock), abi.encodeWithSelector(IStockToken.uiMultiplier.selector), bytes("paused")
                  );
                  bool ok;
                  try vault.settle() {
                      ok = true;
                  } catch {}
                  console2.log("settle() after maturity with reverting multiplier", ok);
                  assertTrue(ok, "OS-05: settle blocked by a reverting stock token");
              }

              /// OS-03: dividen yang tidak pernah di-sync sebelum maturity hilang dari pemegang yield.
              function test_unsyncedDividendAtMaturity() public live {
                  _split(_cap(10e18));
                  _bump(200); // dividen 2%, tidak ada yang memanggil sync()
                  vm.warp(vault.maturity() + 1);
                  vault.settle();
                  uint256 yr = vault.ytRate();
                  console2.log("ytRate after settle", yr);
                  assertGt(yr, 0, "OS-03: a 2% dividend before maturity was never credited to yield holders");
              }

              /// OS-07: pembulatan. Satu user, banyak dividen kecil: tidak boleh keluar lebih dari deposit
              /// dan tidak boleh kehilangan lebih dari toleransi.
              function testFuzz_rounding(uint256 amt, uint8 steps, uint16 bps) public live {
                  amt = bound(amt, 1e6, _cap(1e24));
                  steps = uint8(bound(steps, 1, 10));
                  bps = uint16(bound(bps, 1, 300));

                  _split(amt);
                  for (uint256 i; i < steps; i++) {
                      _bump(bps);
                      _sync();
                  }
                  uint256 out = _settleAndRedeem(true);
                  assertLe(out, amt, "paid out more than deposited (OS-07 rounding or solvency)");
                  assertGe(out + amt / 1e9 + steps, amt, "lost more than rounding tolerance");
              }
          }
          ONION_EOF
          mkdir -p fork/test
          cat > fork/test/Interfaces.sol <<'ONION_EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;

          /// Interface minimal. Setiap fungsi di IOnionVault / IAccountant sudah dicocokkan
          /// dengan selector hardcoded di onionstocks.html (keccak256 dihitung ulang, 25/25 cocok).
          /// uiMultiplier() (0xa60bf13d) adalah ASUMSI tentang token saham asli: itulah yang diuji di sini.

          interface IToken {
              function balanceOf(address) external view returns (uint256);
              function totalSupply() external view returns (uint256);
              function transfer(address, uint256) external returns (bool);
              function approve(address, uint256) external returns (bool);
          }

          interface IStockToken is IToken {
              function uiMultiplier() external view returns (uint256);
              function decimals() external view returns (uint8);
              function symbol() external view returns (string memory);
          }

          interface IAccountant {
              function growth() external view returns (uint256);
              function reviewPending() external view returns (bool);
          }

          interface IOnionVault {
              function stock() external view returns (address);
              function accountant() external view returns (address);
              function principal() external view returns (address);
              function yieldToken() external view returns (address);
              function maturity() external view returns (uint256);
              function settled() external view returns (bool);
              function ptRate() external view returns (uint256);
              function ytRate() external view returns (uint256);
              function split(uint256 amount, address to) external;
              function merge(uint256 amount, address to) external;
              function settle() external;
              function redeemPrincipal(uint256 amount, address to) external;
              function redeemYield(uint256 amount, address to) external;
          }
          ONION_EOF
          mkdir -p fork/script
          cat > fork/script/probe.sh <<'ONION_EOF'
          #!/usr/bin/env bash
          # Probe read-only dengan cast. Butuh: RPC_URL, STOCK.  Pakai:  RPC_URL=... STOCK=0x... ./script/probe.sh
          set -uo pipefail
          : "${RPC_URL:?set RPC_URL}"; : "${STOCK:?set STOCK}"
          c() { cast call "$STOCK" "$1" --rpc-url "$RPC_URL" 2>&1 || true; }
          echo "chain id       : $(cast chain-id --rpc-url "$RPC_URL")"
          echo "code bytes     : $(( $(cast code "$STOCK" --rpc-url "$RPC_URL" | wc -c) / 2 ))"
          echo "symbol         : $(c 'symbol()(string)')"
          echo "decimals       : $(c 'decimals()(uint8)')"
          echo "totalSupply    : $(c 'totalSupply()(uint256)')"
          echo "uiMultiplier   : $(c 'uiMultiplier()(uint256)')"
          echo "paused         : $(c 'paused()(bool)')"
          echo "1967 impl slot : $(cast storage "$STOCK" 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc --rpc-url "$RPC_URL")"
          echo "1967 admin slot: $(cast storage "$STOCK" 0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103 --rpc-url "$RPC_URL")"
          ONION_EOF
          # --- end files
          for d in acct fork; do mkdir -p $d/lib $d/src; git clone --depth 1 https://github.com/foundry-rs/forge-std $d/lib/forge-std; done

